<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My First Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #0f172a, #1e293b);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            width: 350px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        h1 {
            margin-bottom: 10px;
            font-size: 2rem;
            color: #38bdf8;
        }

        h2 {
            margin-bottom: 20px;
            font-weight: normal;
            color: #cbd5e1;
        }

        p {
            line-height: 1.6;
            font-size: 1rem;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 18px;
            background: #38bdf8;
            color: #0f172a;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover {
            background: #0ea5e9;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>Gerald Ugwunna</h1>

        <h2>Devops/Cloud</h2>

        <p>
            Welcome to my first website!  
            I’m excited to learn more about reverse proxying, devops and cloud technologies.
        </p>

        <a href="#" class="btn">Learn More</a>
    </div>

</body>
</html>
