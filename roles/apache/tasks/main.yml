---
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install Apache2
  apt:
    name: apache2
    state: present

- name: Start Apache
  service:
    name: apache2
    state: started

- name: Enable Apache to start on boot
  service:
    name: apache2
    enabled: yes

- name: Deploy homepage from template
  template:
    src: index.html.j2
    dest: /var/www/html/index.html
  notify: Restart Apache
